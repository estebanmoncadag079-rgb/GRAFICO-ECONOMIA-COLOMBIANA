name: Actualizar indicadores Colombia

on:
  schedule:
    # 19:30 en Colombia; GitHub programa el cron en UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Dependencias
        run: python -m pip install -r requirements-update.txt
      - name: Pruebas de formulas y cobertura
        run: python -m unittest discover -s tests
      - name: Consultar fuentes oficiales
        id: update
        continue-on-error: true
        run: python actualizar_todo.py
      - name: Validar tablas
        run: python validar_datos.py
      - name: Publicar datos validados
        run: |
          git add pib_colombia.csv inflacion_clean.csv tasas_interes_clean.csv colcap_oficial.csv indices_experimentales_mensuales.csv estado_fuentes.csv alertas_datos.csv
          if git diff --cached --quiet; then
            echo "Sin cambios de datos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar indicadores publicados"
          git push
      - name: Reportar fallas de fuentes
        if: steps.update.outcome == 'failure'
        run: exit 1
